# Game server on Fly.io. Set secrets before deploy:
#   fly secrets set DATABASE_URL=postgres://... ADMIN_SECRET=... PUBLIC_URL=https://your-app.fly.dev
# Optional: LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, PAYSTACK_SECRET_KEY
app = "bbn-game"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  GAME_SERVER_PORT = "2567"
  NODE_ENV = "production"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
